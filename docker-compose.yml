# Local / self-hosted hub. Config comes from a gitignored .env (see
# packages/hub/.env.example). The same image runs everywhere — only .env differs.
services:
  hub:
    build: .
    image: claude-telegram-hub:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Reachable inside the container network; override in .env as needed.
      HUB_BIND_HOST: 0.0.0.0
      HUB_BIND_PORT: "8787"
    ports:
      - "8787:8787"

  # Cloud bridge (#116): lets Claude Code on the web join the hub over remote MCP.
  # Opt-in: `docker compose --profile bridge up -d`. Config in a gitignored
  # bridge.env (see docs/cloud-agents.md); the hashed token list is mounted read-only.
  bridge:
    profiles: ["bridge"]
    image: claude-telegram-hub:latest
    restart: unless-stopped
    command: ["node", "packages/bridge/dist/main.cjs"]
    env_file: bridge.env
    environment:
      BRIDGE_HUB_URL: ws://hub:8787
      BRIDGE_BIND_HOST: 0.0.0.0
      BRIDGE_BIND_PORT: "8788"
      BRIDGE_TOKENS_FILE: /run/bridge/tokens
    volumes:
      - ${BRIDGE_TOKENS_PATH:-./bridge-tokens}:/run/bridge/tokens:ro
    # Not published on the host: only cloudflared (same network) reaches it.
    expose:
      - "8788"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      - hub

  # Named Cloudflare tunnel to the bridge; the tunnel (public hostname →
  # http://bridge:8788) is managed in the CF dashboard, the token stays on the box.
  cloudflared:
    profiles: ["bridge"]
    # Same version the Phase 0 tunnel ran.
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "run"]
    env_file: cloudflared.env
    depends_on:
      - bridge
