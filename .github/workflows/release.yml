name: Release

# Build and smoke-test the shippable artifacts on a version tag. This does not
# publish anywhere by itself — it proves the hub image and the channel package
# build reproducibly and run. The merge-gate lives in ci.yml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  hub-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build hub image
        run: docker build -t claude-telegram-hub:ci .

      - name: Smoke-test the image
        run: |
          docker run -d --name hub \
            -e HUB_SESSION_SECRET=s -e HUB_ALLOWLIST=1 -e HUB_ADAPTER=loopback \
            -p 8787:8787 claude-telegram-hub:ci
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8787/healthz || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/healthz)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/readyz)" = "200"
          test "$(docker exec hub id -u)" = "1000"   # runs as non-root
          docker rm -f hub

  channel-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -w @claude-telegram-hub/channel

      - name: Pack and smoke-test the standalone channel
        run: bash scripts/smoke-channel.sh

  # Publish the hub image to GHCR on a version tag (not on workflow_dispatch).
  # The package is public, so consumers (e.g. Azure Container Apps) pull it
  # anonymously — no pull secret required.
  publish-image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: hub-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/claude-telegram-hub:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/claude-telegram-hub:latest

  # Publish a GitHub Release for the tag once the artifacts built and the image
  # pushed — so the Releases page tracks the tags (notes come from the annotated
  # tag message). Idempotent: a re-run on an existing release is a no-op.
  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [channel-package, publish-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub Release from the tag annotation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — nothing to do."
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-from-tag
          fi
