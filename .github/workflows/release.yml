name: Release

# Build and smoke-test the shippable artifacts on a version tag. This does not
# publish anywhere by itself — it proves the hub image and the channel package
# build reproducibly and run. The merge-gate lives in ci.yml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  hub-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build hub image
        run: docker build -t claude-telegram-hub:ci .

      - name: Smoke-test the image
        run: |
          docker run -d --name hub \
            -e HUB_SESSION_SECRET=s -e HUB_ALLOWLIST=1 -e HUB_ADAPTER=loopback \
            -p 8787:8787 claude-telegram-hub:ci
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8787/healthz || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/healthz)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/readyz)" = "200"
          test "$(docker exec hub id -u)" = "1000"   # runs as non-root
          docker rm -f hub

  channel-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -w @claude-telegram-hub/channel

      - name: Pack and smoke-test the standalone channel
        run: |
          npm pack -w @claude-telegram-hub/channel
          tgz=$(ls claude-telegram-hub-channel-*.tgz)
          echo "packed $tgz"

          # Unpack into a clean dir with NO workspace and NO node_modules — the
          # exact scenario a real install faces.
          workdir=$(mktemp -d)
          tar -xzf "$tgz" -C "$workdir"
          test -f "$workdir/package/dist/main.cjs"
          test -f "$workdir/package/.mcp.json"
          test -f "$workdir/package/.claude-plugin/plugin.json"
          test ! -d "$workdir/package/node_modules"

          # It must boot self-contained (not ERR_MODULE_NOT_FOUND / dynamic require).
          cd "$workdir/package"
          set +e
          TELEGRAM_HUB_URL=ws://127.0.0.1:59999 TELEGRAM_HUB_SECRET=x TELEGRAM_HUB_AGENT=ci \
            timeout 4 node dist/main.cjs >out.log 2>err.log
          set -e
          echo "--- channel stderr ---"; cat err.log
          if grep -qiE "ERR_MODULE_NOT_FOUND|Dynamic require|SyntaxError" err.log; then
            echo "FAIL: channel bundle is not self-contained"; exit 1
          fi
          grep -q '"msg":"channel started"' err.log || { echo "FAIL: channel did not boot"; exit 1; }
          echo "PASS: channel boots standalone with no node_modules"

  # Publish the hub image to GHCR on a version tag (not on workflow_dispatch).
  # The package is public, so consumers (e.g. Azure Container Apps) pull it
  # anonymously — no pull secret required.
  publish-image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: hub-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/claude-telegram-hub:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/claude-telegram-hub:latest
